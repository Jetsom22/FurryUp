    #fontwarm { position: absolute; left: -9999px; top: -9999px; font-family: "Noto Sans KR"; }
  </style>
</head>
<body>
  <div id="fontwarm"><span style="font-weight:400">가</span><span style="font-weight:700">가</span></div>
  <div id="game"></div>

  <script src="data/stages.js"></script>

  <script src="src/core/stagegen.js"></script>
  <script src="src/core/battle.js"></script>

  <script src="src/scenes/BattleScene.js"></script>
  <script src="src/scenes/StoryScene.js"></script>
  <script src="src/scenes/EventScene.js"></script>

</html>
